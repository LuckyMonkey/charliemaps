# Independent LOCAL DEV stack. Does not alter Fridge's production Caddy or other Neo4j instances.
name: charlie-maps-transit
services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in transit/.env}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - charlie_neo4j_data:/data
      - charlie_neo4j_logs:/logs
    ports:
      - "127.0.0.1:7475:7474"
    networks: [charlie_graph]
  api:
    image: node:22-alpine
    working_dir: /work
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: "4100"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    volumes:
      - ./api:/work
      - charlie_api_node_modules:/work/node_modules
    ports:
      - "127.0.0.1:4100:4100"
    depends_on: [neo4j]
    networks: [charlie_graph, charlie_web]
    restart: unless-stopped
  web:
    image: node:22-alpine
    working_dir: /work
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./web:/work
      - charlie_web_node_modules:/work/node_modules
    ports:
      - "127.0.0.1:5177:5173"
    depends_on: [api]
    networks: [charlie_web]
networks:
  charlie_graph:
    internal: true
  charlie_web: {}
volumes:
  charlie_neo4j_data: {}
  charlie_neo4j_logs: {}
  charlie_api_node_modules: {}
  charlie_web_node_modules: {}
